server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing - any path that isn't a real static
    # file must fall back to index.html, or a hard refresh on e.g. /review-queue
    # would 404 against nginx instead of reaching the React app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
